<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCDK</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #800000; padding: 20px; text-align: center; font-size: 24px; font-weight: 600; }
    nav { display: flex; justify-content: center; gap: 20px; background-color: #1a1a1a; padding: 10px; }
    nav a { color: #ffffff; text-decoration: none; transition: color 0.3s; }
    nav a:hover { color: #800000; }
    main { flex: 1; padding: 40px 20px; max-width: 1000px; margin: 0 auto; width: 100%; }

    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 36px; color: #800000; margin-bottom: 10px; }

    /* Custom Chatbot Floating Widget */
    #chat-widget-button {
      position: fixed; bottom: 20px; right: 20px;
      background-color: #800000; color: white;
      border: none; border-radius: 50%; width: 60px; height: 60px;
      font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000;
    }
    #chat-box {
      display: none; position: fixed; bottom: 90px; right: 20px;
      width: 340px; height: 450px; background-color: #1e1e1e;
      border: 1px solid #333; border-radius: 12px;
      flex-direction: column; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.6); z-index: 1000;
    }
    .chat-header {
      background-color: #800000; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; font-weight: 600;
    }
    .chat-header button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    .chat-messages {
      flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px;
    }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
    .user-msg { background-color: #800000; color: white; align-self: flex-end; }
    .bot-msg { background-color: #2a2a2a; color: #ddd; align-self: flex-start; }
    .chat-input-area { display: flex; border-top: 1px solid #333; padding: 8px; background-color: #141414; }
    .chat-input-area input {
      flex: 1; padding: 8px 12px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; outline: none;
    }
    .chat-input-area button {
      background: #800000; border: none; color: white; padding: 8px 14px; margin-left: 6px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>RCDK</header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>

  <main>
    <section class="hero">
      <h1>Welcome to RCDK</h1>
      <p>Unlimited AI assistant ready to help!</p>
    </section>
  </main>

  <!-- Floating Chatbot Button -->
  <button id="chat-widget-button" onclick="toggleChat()">💬</button>

  <!-- Chat Window -->
  <div id="chat-box">
    <div class="chat-header">
      <span>Complexity AI</span>
      <button onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot-msg">Hello! I am Complexity. How can I help you today?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Ask Complexity..." onkeypress="handleKey(event)" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Paste your Google Gemini API key inside the quotes below:
    const GEMINI_API_KEY = "AQ.Ab8RN6KsIzGqW-36QmwxJ9ztni-srCCRxpEZOhO3dNAtuazp6w";

    const SYSTEM_PROMPT = "You are Complexity, an AI assistant for RCDK. RCDK stands for: R = RUTHVIK G ACHAR (Creator & Founder), C = CHINMAYA (Developer's Teammate/Friend), D = DAIWIK (Developer's Teammate/Friend), K = KANISHK (Developer's Teammate/Friend). Ruthvik G Achar created and built RCDK.";

    function toggleChat() {
      const chatBox = document.getElementById('chat-box');
      chatBox.style.display = (chatBox.style.display === 'flex') ? 'none' : 'flex';
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('chatMessages');

      // User Message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user-msg';
      userDiv.innerText = text;
      container.appendChild(userDiv);
      input.value = '';
      container.scrollTop = container.scrollHeight;

      // Loading indicator
      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot-msg';
      botDiv.innerText = "Thinking...";
      container.appendChild(botDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              { role: 'user', parts: [{ text: SYSTEM_PROMPT + "\n\nUser Question: " + text }] }
            ]
          })
        });
        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        botDiv.innerText = reply;
      } catch (err) {
        botDiv.innerText = "Sorry, I had trouble processing that request.";
      }
      container.scrollTop = container.scrollHeight;
    }
  </script>

</body>
  </html>
